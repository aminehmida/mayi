# Builds every release file and publishes the release when a vVERSION tag is
# pushed: the same scripts/release.sh and scripts/publish.py as by hand.
# Run it from the Actions tab ("Run workflow") to build without publishing;
# the files are then attached to the run.
#
# Needs two repository secrets: MAYI_KEYSTORE_BASE64 (the Android signing
# key, base64) and MAYI_KEYSTORE_PASSWORD. Every release must be signed with
# that same key, or installed copies cannot update.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] ||
              { echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }
            [ -f "docs/releases/v$version.md" ] ||
              { echo "::error::docs/releases/v$version.md is missing"; exit 1; }
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl \
            aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Signing key
        env:
          MAYI_KEYSTORE_BASE64: ${{ secrets.MAYI_KEYSTORE_BASE64 }}
        run: |
          [ -n "$MAYI_KEYSTORE_BASE64" ] || { echo "::error::the MAYI_KEYSTORE_BASE64 secret is not set"; exit 1; }
          printf '%s' "$MAYI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mayi-release.jks"

      - name: Build
        env:
          MAYI_KEYSTORE: ${{ runner.temp }}/mayi-release.jks
          MAYI_KEYSTORE_PASSWORD: ${{ secrets.MAYI_KEYSTORE_PASSWORD }}
        run: scripts/release.sh

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mayi-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: mayi-${{ env.VERSION }}
          path: dist/${{ env.VERSION }}/
          retention-days: 14

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py

      - name: Point Homebrew at the release
        if: github.ref_type == 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git switch --quiet -c "homebrew-$VERSION"
          git commit --quiet -am "Point Homebrew at $VERSION"
          git rebase --quiet origin/main
          git push origin HEAD:main
