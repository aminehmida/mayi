[package]
name = "mayi-ffi"
version.workspace = true
edition.workspace = true

[lib]
# staticlib for the Mac app, cdylib for Android and JVM tests.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
mayi-core.workspace = true
mayi-proto.workspace = true
uniffi = "0.32"
thiserror = "2"
zeroize = "1"
libc = "0.2"
